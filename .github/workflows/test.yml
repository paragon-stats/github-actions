name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  branch-name:
    name: branch-name (${{ matrix.case.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        case:
          - {name: valid, branch: 'ci/14-protected-trunk', expect: success}
          - {name: valid-multi-hyphen, branch: 'chore/198-github-mcp-server', expect: success}
          - {name: exempt-bot, branch: 'dependabot/nuget/xunit-4.0.0', expect: success}
          - {name: no-issue-number, branch: 'ci/protected-trunk', expect: failure}
          - {name: unknown-type, branch: 'wip/14-something', expect: failure}
          - {name: uppercase, branch: 'ci/14-Protected-Trunk', expect: failure}
          # Proves the type set is read from the shared commit-types.txt: this
          # type exists only there, never in an action.yml default.
          - {name: security-type, branch: 'security/42-harden-workflows', expect: success}
    steps:
      - uses: actions/checkout@v5
      - id: run
        continue-on-error: true
        uses: ./branch-name
        with:
          branch: ${{ matrix.case.branch }}
      - name: assert
        shell: bash
        env:
          OUTCOME: ${{ steps.run.outcome }}
          EXPECT: ${{ matrix.case.expect }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "$EXPECT" ] || { echo "::error::expected $EXPECT, got $OUTCOME"; exit 1; }
          echo "OK: $EXPECT"

  check-commit-message:
    name: check-commit-message (${{ matrix.case.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        case:
          - {name: valid, subject: 'ci(lint): tighten the check', paths: '', expect: success}
          - {name: valid-breaking, subject: 'feat!: rework the parser', paths: 'src/Core/P.cs', expect: success}
          - {name: exempt-merge, subject: 'Merge branch main into topic', paths: '', expect: success}
          - {name: no-type, subject: 'tighten the check', paths: '', expect: failure}
          - {name: unknown-type, subject: 'wip: tighten the check', paths: '', expect: failure}
          - {name: no-space, subject: 'ci:tighten the check', paths: '', expect: failure}
          - {name: feat-outside-src, subject: 'feat: add a workflow', paths: '.github/workflows/x.yml', expect: failure}
          - {name: feat-inside-src, subject: 'feat: add a parser', paths: 'src/Core/P.cs', expect: success}
          - {name: chore-outside-src, subject: 'chore: bump a tool', paths: '.config/tools.json', expect: success}
          - {name: scope-with-slash, subject: 'ci(git/hooks): tidy', paths: '', expect: success}
          # The guard derives from the fact-set's bump column: every type that
          # is not "none" bumps the version and must touch product code.
          # Hardening a workflow or reverting a CI file must not cut a release.
          - {name: security-inside-src, subject: 'security: escape the input', paths: 'src/Core/P.cs', expect: success}
          - {name: security-outside-src, subject: 'security: pin the actions', paths: '.github/workflows/x.yml', expect: failure}
          - {name: perf-outside-src, subject: 'perf: shrink the CI image', paths: '.github/workflows/x.yml', expect: failure}
          - {name: revert-outside-src, subject: 'revert(ci): remove the pipeline', paths: '.github/workflows/x.yml', expect: failure}
          # "Revert" is exempt by default; a repo can narrow the pattern to
          # force hand-written revert(scope) subjects instead.
          - {name: revert-exempt-default, subject: 'Revert "feat: add a parser"', paths: '.github/x.yml', expect: success}
          - {name: revert-not-exempt, subject: 'Revert "feat: add a parser"', paths: '', exempt: '^(Merge |fixup!|squash!)', expect: failure}
          # Regressions. Each of these shipped broken once; none is reproducible
          # on a Windows dev box, which is why they live here.
          - {name: windows-separators, subject: 'feat: add a parser', paths: 'src\Core\P.cs', expect: success}
          - {name: whitespace-only-paths, subject: 'feat: add a parser', paths: '  ', expect: success}
          - {name: slash-in-types, subject: 'feat: add a parser', paths: 'src/a.cs', types: 'feat|fix|foo/bar', expect: success}
          - {name: prefix-types, subject: 'feature: overhaul', paths: 'docs/x.md', types: 'feat|feature', expect: success}
          - {name: prefix-types-reordered, subject: 'feature: overhaul', paths: 'docs/x.md', types: 'feature|feat', expect: success}
    steps:
      - uses: actions/checkout@v5
      - name: write fixture
        shell: bash
        env:
          SUBJECT: ${{ matrix.case.subject }}
        run: printf '%s\n' "$SUBJECT" > "$RUNNER_TEMP/msg.txt"
      - id: run
        continue-on-error: true
        uses: ./check-commit-message
        with:
          message-file: ${{ runner.temp }}/msg.txt
          changed-paths: ${{ matrix.case.paths }}
          # Empty for most cases, so they exercise the shared commit-types.txt
          # rather than a list restated here.
          types: ${{ matrix.case.types }}
          exempt-pattern: ${{ matrix.case.exempt }}
      - name: assert
        shell: bash
        env:
          OUTCOME: ${{ steps.run.outcome }}
          EXPECT: ${{ matrix.case.expect }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "$EXPECT" ] || { echo "::error::expected $EXPECT, got $OUTCOME"; exit 1; }
          echo "OK: $EXPECT"

  # A UTF-8 BOM cannot be expressed in the matrix, and a path list large enough
  # to fill the pipe buffer has to be generated. Both broke the script before.
  check-commit-message-edge:
    name: check-commit-message (edge)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: fixture - UTF-8 BOM
        shell: bash
        run: |
          printf '\xef\xbb\xbffeat: add a parser\n' > "$RUNNER_TEMP/bom.txt"
      - id: bom
        continue-on-error: true
        uses: ./check-commit-message
        with:
          message-file: ${{ runner.temp }}/bom.txt
          changed-paths: 'src/Core/P.cs'

      # >64KB of paths with the ONLY product file first: `grep -q` used to exit
      # early, SIGPIPE the producer, and pipefail turned that into "no match".
      # Sized ~90KB: above the 64KB pipe buffer that triggers the bug, below the
      # 128KB Linux MAX_ARG_STRLEN ceiling on a single env var - past that the
      # runner cannot pass changed-paths at all and the step dies before the
      # script runs. Consumers with enormous PRs hit that limit, not this bug.
      - name: fixture - oversized path list
        id: big
        shell: bash
        run: |
          set -euo pipefail
          printf 'feat: add a parser\n' > "$RUNNER_TEMP/big-msg.txt"
          { printf 'src/hit.cs'; for i in $(seq 1 5000); do printf ' docs/file%05d.md' "$i"; done; } > "$RUNNER_TEMP/paths.txt"
          echo "bytes=$(wc -c < "$RUNNER_TEMP/paths.txt")" >> "$GITHUB_OUTPUT"
          { echo 'paths<<EOF'; cat "$RUNNER_TEMP/paths.txt"; echo; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      - id: oversized
        continue-on-error: true
        uses: ./check-commit-message
        with:
          message-file: ${{ runner.temp }}/big-msg.txt
          changed-paths: ${{ steps.big.outputs.paths }}

      # Every type in the fact-set must land in the alternation as its own
      # token: a formatting slip (compound row, stray column) would silently
      # reject docs:/chore:/ci: - most commits in the org - while the
      # single-type matrix cases still pass.
      - name: fixture - every fact-set type validates
        shell: bash
        run: |
          set -euo pipefail
          while read -r t _; do
            printf '%s: exercise the fact-set\n' "$t" > "$RUNNER_TEMP/type.txt"
            MESSAGE_FILE="$RUNNER_TEMP/type.txt" CHANGED_PATHS='src/x.cs' TYPES_FILE=commit-types.txt \
              bash check-commit-message/check-commit-message.sh
          done < <(grep -vE '^[[:space:]]*(#|$)' commit-types.txt)

      # An unquoted path containing a glob must not re-resolve against the CWD,
      # which holds a real src/ directory here.
      - name: fixture - glob in path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src
          printf 'feat: add a parser\n' > "$RUNNER_TEMP/glob-msg.txt"
      - id: glob
        continue-on-error: true
        uses: ./check-commit-message
        with:
          message-file: ${{ runner.temp }}/glob-msg.txt
          changed-paths: '*'
          product-path: 'src'

      - name: assert
        shell: bash
        env:
          BOM: ${{ steps.bom.outcome }}
          OVERSIZED: ${{ steps.oversized.outcome }}
          GLOB: ${{ steps.glob.outcome }}
          BYTES: ${{ steps.big.outputs.bytes }}
        run: |
          set -euo pipefail
          rc=0
          [ "$BOM" = "success" ] || { echo "::error::BOM: expected success, got $BOM"; rc=1; }
          [ "$OVERSIZED" = "success" ] || { echo "::error::oversized ($BYTES bytes): expected success, got $OVERSIZED"; rc=1; }
          [ "$GLOB" = "failure" ] || { echo "::error::glob: expected failure, got $GLOB"; rc=1; }
          [ "$rc" = "0" ] && echo "OK (path list was $BYTES bytes)"
          exit "$rc"

  # D2 applied to ourselves: pyproject.toml restates the bump mapping for PSR,
  # commit-types.txt stays the source of truth, drift fails the build.
  bump-mapping-drift:
    name: bump mapping matches commit-types.txt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, tomllib

          types = {}
          for line in open("commit-types.txt"):
              cols = line.split("#")[0].split()
              if cols:
                  types[cols[0]] = cols[1]

          opts = tomllib.load(open("pyproject.toml", "rb"))["tool"]["semantic_release"]["commit_parser_options"]
          checks = {
              "allowed_tags": sorted(types),
              "minor_tags": sorted(t for t, b in types.items() if b == "minor"),
              "patch_tags": sorted(t for t, b in types.items() if b == "patch"),
          }
          rc = 0
          for key, want in checks.items():
              got = sorted(opts[key])
              if got != want:
                  print(f"::error::pyproject {key} drifted: {got} != commit-types.txt {want}")
                  rc = 1
          sys.exit(rc)
          PY

  # Cuts the release for whatever landed on main, once every check above is
  # green - v1.1.0 shipped broken precisely because tagging outran CI. PSR
  # pushes the vX.Y.Z tag and the GitHub release; the moving major tag is ours.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [branch-name, check-commit-message, check-commit-message-edge, bump-mapping-drift]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: sign tags when the key secret exists
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
            keyid="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ { print $5; exit }')"
            git config user.signingkey "$keyid"
            git config tag.gpgSign true
            echo "signing with $keyid"
          else
            echo "GPG_PRIVATE_KEY not set; tags will be unsigned"
          fi
      - name: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pip install --quiet python-semantic-release==10.6.2
          semantic-release version --no-changelog --no-commit --tag --push --vcs-release
      - name: move the major tag
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')"
          major="${latest%%.*}"
          if [ "$(git rev-parse "$major^{commit}" 2>/dev/null || true)" != "$(git rev-parse "$latest^{commit}")" ]; then
            git tag -f "$major" "$latest^{commit}"
            git push -f origin "$major"
            echo "moved $major -> $latest"
          else
            echo "$major already at $latest"
          fi

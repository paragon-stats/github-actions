# python-semantic-release, tag-only: computes the bump from commits since the
# last v* tag, pushes the tag, and creates the GitHub release. Nothing here
# builds or stamps a version into a file - consumers pin tags/SHAs.
#
# The mapping below restates commit-types.txt, which stays the source of
# truth: CI diffs the two and fails on drift (D2, applied to ourselves).
[tool.semantic_release]
allow_zero_version = false

[tool.semantic_release.commit_parser_options]
# The parser only classifies types it is allowed to see; the default set
# lacks security and revert, so list all twelve explicitly.
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "revert", "security", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "security", "revert"]

name: branch-name
description: Validate a branch name follows the <type>/<issue#>-<short-kebab-summary> convention.

inputs:
  branch:
    description: Branch name to validate (e.g. the PR head ref).
    required: true
  types:
    description: >-
      Pipe-separated Conventional Commit types accepted as the branch prefix.
      Empty reads the shared, versioned commit-types.txt at the root of this
      repo - the org's single source of truth. Set it only to narrow or extend
      the set for one repo.
    required: false
    default: ''
  exempt-pattern:
    description: >-
      Extended regex matching branches that are exempt, such as bot-generated
      ones that cannot follow the convention.
    required: false
    default: '^dependabot/'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        TYPES: ${{ inputs.types }}
        # action_path is this subdirectory; the fact-set sits at the repo root
        # so check-commit-message reads the very same file.
        TYPES_FILE: ${{ github.action_path }}/../commit-types.txt
        EXEMPT_PATTERN: ${{ inputs.exempt-pattern }}
      run: |
        set -euo pipefail

        if [ -z "$BRANCH" ]; then
          echo "::error::no branch name given"
          exit 2
        fi

        # Column 1 of each non-comment row of the shared fact-set.
        if [ -z "$TYPES" ]; then
          TYPES="$(awk '!/^[[:space:]]*#/ && NF { printf "%s%s", sep, $1; sep = "|" }' "$TYPES_FILE")"
          if [ -z "$TYPES" ]; then
            echo "::error::no commit types found in $TYPES_FILE"
            exit 2
          fi
        fi

        # A pattern that does not compile must fail closed: grep exits 2 on a
        # bad regex, which inside an if-condition reads as "no match" and would
        # skip the very check the pattern exists for.
        for pat in "$TYPES" "$EXEMPT_PATTERN"; do
          rc=0
          grep -qE -e "$pat" /dev/null 2>/dev/null || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error::invalid extended regex in types/exempt-pattern: $pat"
            exit 2
          fi
        done

        if [ -n "$EXEMPT_PATTERN" ] && printf '%s' "$BRANCH" | grep -qE "$EXEMPT_PATTERN"; then
          echo "Exempt automation branch: $BRANCH"
          exit 0
        fi

        if ! printf '%s' "$BRANCH" | grep -qE "^($TYPES)/[0-9]+-[a-z0-9-]+$"; then
          echo "::error::Branch \"$BRANCH\" does not match <type>/<issue#>-<short-kebab-summary> (e.g. ci/14-protected-trunk)"
          echo "Accepted types: ${TYPES//|/, }"
          exit 1
        fi

        echo "OK: $BRANCH"

name: release
description: >-
  Cut a release with python-semantic-release, tag-only: compute the bump from
  Conventional Commits since the last v* tag, push a (GPG-signed) tag, and
  create the GitHub Release. No commit, no changelog file - the pattern for
  repos whose rulesets forbid bot commits to the default branch.
  Preconditions (enforced): a full checkout with tags (actions/checkout
  fetch-depth: 0), at least one vX.Y.Z tag (seed new repos with v0.0.0), and
  a [tool.semantic_release] section in pyproject.toml declaring the bump
  mapping - the action ships the mechanism, the repo declares the policy.

inputs:
  gpg-private-key:
    description: >-
      ASCII-armored passphrase-less GPG private key to sign tags with. Empty
      skips signing. A passphrase-protected key fails fast here rather than
      cryptically inside semantic-release.
    required: false
    default: ''
  github-token:
    description: Token used to push the tag and create the GitHub Release.
    required: false
    default: ${{ github.token }}
  vcs-release:
    description: >-
      Create the GitHub Release ("true", the default) or push the tag only
      ("false"). Repos with immutable releases that attach build assets must
      use "false" and create the Release themselves - as a draft, assets
      uploaded, then published - because a published immutable release
      accepts no further uploads.
    required: false
    default: 'true'

outputs:
  released:
    description: '"true" when this run cut a new tag, else "false".'
    value: ${{ steps.release.outputs.released }}
  tag:
    description: The latest vX.Y.Z tag after the run (new or pre-existing).
    value: ${{ steps.release.outputs.tag }}

runs:
  using: composite
  steps:
    # Fail-closed preconditions: a shallow or tagless clone makes PSR compute
    # from nothing and re-cut old versions, and PSR without declared parser
    # options silently falls back to defaults that lack security/revert.
    - name: verify preconditions
      shell: bash
      run: |
        set -euo pipefail
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error::shallow clone: check out with fetch-depth: 0 so tags and history are present"
          exit 1
        fi
        if [ -z "$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*')" ]; then
          echo "::error::no vX.Y.Z tag found: fetch tags (fetch-depth: 0), or seed a new repo with v0.0.0"
          exit 1
        fi
        if ! grep -qs '^\[tool\.semantic_release\]' pyproject.toml; then
          echo "::error::pyproject.toml lacks [tool.semantic_release]: declare the bump mapping (the action ships the mechanism, not the policy)"
          exit 1
        fi
    - name: sign tags when a key is provided
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
      run: |
        set -euo pipefail
        if [ -n "$GPG_PRIVATE_KEY" ]; then
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          # The keyid comes from the provided key itself, never from the
          # keyring - a reused runner may hold other keys.
          keyid="$(printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --with-colons --import-options show-only --import 2>/dev/null | awk -F: '/^sec/ { print $5; exit }')"
          if [ -z "$keyid" ]; then
            echo "::error::could not read a secret key id from gpg-private-key"
            exit 1
          fi
          # Fail here with a clear message, not later inside semantic-release:
          # headless signing requires a passphrase-less key.
          if ! printf 'probe' | gpg --batch --pinentry-mode error --local-user "$keyid" --detach-sign > /dev/null 2>&1; then
            echo "::error::gpg-private-key needs a passphrase to sign; CI signing requires a passphrase-less key"
            exit 1
          fi
          git config user.signingkey "$keyid"
          git config tag.gpgSign true
          echo "signing with $keyid"
        else
          echo "no key provided; tags will be unsigned"
        fi
    - name: release
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VCS_RELEASE: ${{ inputs.vcs-release }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        before="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
        pip install --quiet python-semantic-release==10.6.2
        if [ "$VCS_RELEASE" = "true" ]; then
          semantic-release version --no-changelog --no-commit --tag --push --vcs-release
        else
          semantic-release version --no-changelog --no-commit --tag --push --no-vcs-release
        fi
        after="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
        if [ -n "$after" ] && [ "$after" != "$before" ]; then released=true; else released=false; fi
        echo "released=$released" >> "$GITHUB_OUTPUT"
        echo "tag=$after" >> "$GITHUB_OUTPUT"
        echo "released=$released tag=$after"
